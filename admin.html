<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard | MediCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar"></div>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 admin-sidebar">

    <h4>💚 MediCare</h4>

    <hr>

    <a href="admin.html">📊 Dashboard</a>

    <a href="#medicineManagement">💊 Medicines</a>

    <a href="#orders">📦 Orders</a>

    <a href="index.html">🌐 View Website</a>

    <hr>

    <button class="logout-btn" onclick="logoutAdmin()">
        🚪 Logout
    </button>

</aside>
            <main class="col-md-9 col-lg-10 p-4">
                <h2>Admin Dashboard</h2>
                <div class="row g-3 my-3">
                    <div class="col-md-4">
                        <div class="dashboard-card">Total Medicines<h2 id="totalMedicines">0</h2>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="dashboard-card">Total Orders<h2 id="totalOrders">0</h2>
                        </div>
                    </div>
                </div>
                <section id="medicineManagement" class="my-5">
                    <h3>Manage Medicines</h3>
                    <form id="medicineForm" class="card p-4 my-3" onsubmit="addMedicine(event)">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Name</label><input id="medName"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Category</label><input id="medCategory"
                                    class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Price (₹)</label><input id="medPrice"
                                    type="number" min="1" class="form-control" required></div>
                            <div class="col-md-6"><label class="form-label">Description</label><input
                                    id="medDescription" class="form-control" required></div>
                        </div><button class="btn btn-primary mt-3">Add Medicine</button>
                    </form>
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="adminMedicineList"></tbody>
                        </table>
                    </div>
                </section>
                <section id="orders">
                    <h3>Recent Orders</h3>
                    <div id="orderList"></div>
                </section>
            </main>
        </div>
    </div>
    <script>document.addEventListener("DOMContentLoaded", () => { displayOrders(); });</script>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script>
    if (localStorage.getItem("adminLoggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>
</body>

</html>
