<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | MediCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="navbar"></div>
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card p-4 shadow-sm">
                        <h2 class="text-center mb-4">Login</h2>
                        <form onsubmit="loginUser(event)"><label class="form-label">Email</label><input type="email"
                                id="email" class="form-control mb-3" required><label
                                class="form-label">Password</label><input type="password" id="password"
                                class="form-control mb-3" required><button class="btn btn-primary w-100">Login</button>
                        </form><small class="text-muted mt-3"></small>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
